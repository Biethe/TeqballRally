name: Android build

# Builds on GitHub's runners, which can reach the Android SDK endpoints, so a
# phone can be provisioned without a development machine to hand.
#
# Two artifacts:
#   * teqrallly-debug-apk — an installable debug APK for sideload testers.
#     Open the run on a phone, download it, unzip and install app-debug.apk.
#     Android will ask you to allow installs from unknown sources.
#   * teqrallly-release-aab — a signed Android App Bundle for the Play Store
#     (closed test track). Only produced when the signing secrets are set;
#     upload it to the console. Not produced on deploy-chained runs.
#
# Signing is optional so the debug APK keeps building everywhere. To enable the
# AAB, add these repository secrets under Settings -> Secrets and variables ->
# Actions -> Secrets:
#   KEYSTORE_BASE64   the upload keystore (.jks) base64-encoded
#   KEYSTORE_PASSWORD the keystore password
#   KEY_ALIAS         the key alias
#   KEY_PASSWORD      the key password

on:
  workflow_dispatch:
    inputs:
      relay_url:
        description: "Match relay (blank = repo variable, then the default below)"
        required: false
        type: string
  # Called by `deploy.yml` with the URL of the server it has just deployed, so
  # the APK is built against that one rather than against whatever the
  # repository variable was last set to.
  workflow_call:
    inputs:
      relay_url:
        description: "Match relay to bake into the build"
        required: false
        type: string
  push:
    branches: ["claude/**"]
    paths-ignore:
      - "**/*.md"

env:
  # Last resort so a build is never quietly shipped with online play disabled.
  # Builds 22-24 went out that way: only the runs dispatched by hand carried a
  # relay, because nothing had ever set the repository variable the push builds
  # fall back to. Set `VITE_RELAY_URL` under Settings -> Secrets and variables
  # -> Actions -> Variables to point every build somewhere else.
  # The Cloud Run service, in europe-west9 alongside Firestore — the database
  # with the real player records behind it. Do NOT judge it by /healthz: that
  # path is intercepted on some home/carrier networks and answers a Google 404
  # while the service is fine. `curl .../api/leaderboard` is the honest check
  # (verified live 2026-08-16). The old Render relay still answers too, but
  # against an empty file store — pointing a build there splits the
  # leaderboard.
  DEFAULT_RELAY: wss://teqrallly-rpvbgjr3wa-od.a.run.app

# Scoped to the calling workflow as well as the branch: without that, a push
# build would cancel the APK a deploy had just chained on the same branch, and
# the deploy would report a failure for a build it never needed to lose.
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Installs the command-line tools and accepts the SDK licences. Gradle
      # then fetches compileSdk 35 and the matching build-tools itself.
      #
      # `packages:` is set only to drop `tools` from the action's default of
      # `tools platform-tools`. `tools` is the obsolete SDK Tools package
      # Google has now removed from the repository, so sdkmanager answers
      # "Failed to find package 'tools'" and exits 1 — which fails this job in
      # the first thirty seconds, before a line of the app is built, and reads
      # like a broken commit rather than a package that stopped existing. The
      # same workflow passed four days earlier; nothing here changed.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm ci

      # A packaged app cannot discover the relay: its own origin is
      # https://localhost, so a same-origin guess would point at the phone.
      # The address is baked in here — the dispatch input if one was typed,
      # then the repository variable, then DEFAULT_RELAY above — so a build can
      # be produced entirely from the GitHub UI with no machine involved.
      # The art is not in this repository. An APK without it installs and runs
      # into an empty stage, which is not a build worth attaching to a run, so
      # this one is fatal where CI's is only a notice.
      - name: Fetch the art bundle
        env:
          ASSET_BUNDLE_URL: ${{ secrets.ASSET_BUNDLE_URL }}
          ASSET_BUNDLE_KEY: ${{ secrets.ASSET_BUNDLE_KEY }}
          # Falls back to this run's own token, which is what makes a release
          # asset on this private repository work with no token secret at all:
          # the bundle lives in the same repo the job is already authorised
          # for. An unauthenticated request for a private asset answers 404,
          # not 403, so without this the setup fails looking like a wrong URL.
          # An explicit secret still wins, for a bundle hosted anywhere else.
          ASSET_BUNDLE_TOKEN: ${{ secrets.ASSET_BUNDLE_TOKEN || github.token }}
        run: npm run assets:fetch

      - name: Build web assets and sync into the native project
        env:
          VITE_RELAY_URL: ${{ inputs.relay_url || vars.VITE_RELAY_URL || env.DEFAULT_RELAY }}
          # An APK is a zip anybody can open, which is the case this exists
          # for. `scripts/protect-assets.mjs` refuses to run without it rather
          # than falling back to a passphrase written in the repository, which
          # is what every build before this one shipped with.
          VITE_ASSET_KEY: ${{ secrets.VITE_ASSET_KEY }}
          # The RevenueCat key is per store and per project, and the one
          # compiled in when this is unset is a Test Store key — fake purchases,
          # right for developing and wrong for anything that reaches a phone.
          # It lived only in a local .env, which is gitignored, so every build
          # made here silently shipped the test key and a tester who got as far
          # as paying was told the app was still in test mode.
          VITE_REVENUECAT_KEY: ${{ secrets.VITE_REVENUECAT_KEY }}
        run: |
          if [ -z "$VITE_RELAY_URL" ]; then
            echo "::warning::No relay configured — online play will show as unavailable."
          else
            echo "Relay: $VITE_RELAY_URL"
          fi
          if [ -z "$VITE_ASSET_KEY" ]; then
            echo "::error::VITE_ASSET_KEY is not set — refusing to build an APK with unprotected assets."
            exit 1
          fi
          case "$VITE_REVENUECAT_KEY" in
            "")
              echo "::error::VITE_REVENUECAT_KEY is not set — that build would ship the Test Store key and no real purchase could complete. Add it under Settings -> Secrets and variables -> Actions."
              exit 1
              ;;
            test_*)
              echo "::error::VITE_REVENUECAT_KEY is a Test Store key. A Play build needs the goog_ Android key from the RevenueCat dashboard."
              exit 1
              ;;
            *)
              echo "RevenueCat: ${VITE_REVENUECAT_KEY%%_*}_… key"
              ;;
          esac
          npm run android:sync

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      # Works out whether a signed AAB can be produced: either the signing
      # secrets are set, or a keystore + android/keystore.properties have been
      # committed to the repo. Either way bundleRelease below will find what it
      # needs; otherwise it is skipped so the debug APK still builds everywhere.
      # (A committed keystore is convenient but ships the signing credentials in
      # the repository — keep the repo private and prefer CI secrets for shared
      # projects. See the header note.)
      # Works out whether a signed AAB can be produced. The secret is read via
      # the env (not in an `if`, which can't see secrets) and surfaced as step
      # outputs; steps below gate on those outputs instead.
      - name: Detect signing availability
        id: detect-signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$KEYSTORE_BASE64" ] || [ -f android/keystore.properties ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
          fi

      # Only when the signing secrets are present: materialise the upload
      # keystore next to android/keystore.properties exactly as a local release
      # build expects, overwriting any committed one. Absent on deploy-chained
      # runs (secrets aren't forwarded to workflow_call) and on forks without
      # them, where a committed keystore — if any — is still used.
      - name: Prepare release signing
        if: ${{ steps.detect-signing.outputs.has_secret == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/release-key.jks
          cat > android/keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "Release signing configured for bundleRelease."

      - name: Bundle release AAB
        if: ${{ steps.detect-signing.outputs.has_signing == 'true' }}
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease

      - name: Report APK size
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          ls -la "$apk"
          echo "### APK built" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$(du -h "$apk" | cut -f1)\` — commit \`${GITHUB_SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          relay="${{ inputs.relay_url || vars.VITE_RELAY_URL || env.DEFAULT_RELAY }}"
          echo "Relay: \`${relay:-none — online play disabled}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: teqrallly-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Report AAB size
        if: ${{ steps.detect-signing.outputs.has_signing == 'true' }}
        run: |
          aab=android/app/build/outputs/bundle/release/app-release.aab
          ls -la "$aab"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### AAB (Play Store) built" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$(du -h "$aab" | cut -f1)\` — commit \`${GITHUB_SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Upload this to the Play Console closed test track." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AAB
        if: ${{ steps.detect-signing.outputs.has_signing == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: teqrallly-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90

      # Artifacts download as a zip that has to be extracted before Android
      # will install anything — awkward on a phone, which is exactly where
      # these builds are needed. A release asset is a direct .apk link instead.
      # The repository is private, so the release is visible only to people who
      # can already see the code.
      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
          RELAY: ${{ inputs.relay_url || vars.VITE_RELAY_URL || env.DEFAULT_RELAY }}
        run: |
          # The run number belongs to whichever workflow is running, so a
          # deploy-chained build and a push build can reach the same one. A
          # duplicate tag would fail the release step — and so the deploy —
          # after everything that mattered had already succeeded.
          tag="build-${{ github.run_number }}"
          while gh release view "$tag" >/dev/null 2>&1; do
            tag="${tag}b"
          done
          cp android/app/build/outputs/apk/debug/app-debug.apk "teqrallly-${tag}.apk"
          gh release create "$tag" "teqrallly-${tag}.apk" \
            --title "TeqRallly debug ${tag}" \
            --notes "Commit \`${GITHUB_SHA:0:7}\` on \`${GITHUB_REF_NAME}\`.
          Relay: \`${RELAY:-none — online play disabled in this build}\`

           Install on Android: open the .apk below and allow installs from unknown sources.
           Debug build — not for the Play Store. The signed AAB for the Play
           closed test is attached to this run as the teqrallly-release-aab
           artifact (only when signing secrets are configured)." \
            --prerelease \
            --target "$GITHUB_SHA"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Direct download: $(gh release view "$tag" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
