name: Android APK

# Builds an installable debug APK on GitHub's runners, which can reach the
# Android SDK endpoints. Use this to get a build onto a phone without a
# development machine to hand.
#
# The APK is attached to the run as an artifact. Open the run on a phone,
# download "teqopen-debug-apk", unzip it and install app-debug.apk. Android
# will ask you to allow installs from unknown sources.

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths-ignore:
      - "**/*.md"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Installs the command-line tools and accepts the SDK licences. Gradle
      # then fetches compileSdk 35 and the matching build-tools itself.
      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync into the native project
        run: npm run android:sync

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Report APK size
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          ls -la "$apk"
          echo "### APK built" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$(du -h "$apk" | cut -f1)\` — commit \`${GITHUB_SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: teqopen-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
